<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
      #root {
        width: 100%; height: 100%; position: relative;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: radial-gradient(circle at 50% 40%, #1e293b 0%, #0a0a0a 70%);
      }
      #tag {
        position: absolute; top: 260px; left: 0; right: 0; text-align: center;
        color: #a1a1aa; font-size: 40px; letter-spacing: 0.3em; text-transform: uppercase;
      }
      #captions {
        position: absolute; top: 760px; left: 80px; right: 80px; text-align: center;
        color: #fafafa; font-size: 120px; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em;
      }
      .w { display: inline-block; opacity: 0; margin: 0 14px; }
      .w.hl { color: #facc15; }
      #bar { position: absolute; bottom: 220px; left: 80px; height: 10px; width: 920px; background: #facc15; border-radius: 5px; transform-origin: left; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="tag" class="clip" data-start="0" data-duration="5" data-track-index="0">Vídeo de prueba</div>
      <div id="captions" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <span class="w">Tus</span><span class="w hl">reels</span><span class="w">editados</span><span class="w">con</span><span class="w hl">HyperFrames</span>
      </div>
      <div id="bar" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#tag", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5 }, 0);
      // Palabra a palabra, como subtítulos sincronizados con la voz
      const times = [0.4, 0.9, 1.5, 2.1, 2.5];
      document.querySelectorAll(".w").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, times[i]);
      });
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 5, ease: "none" }, 0);
      tl.to("#captions", { scale: 1.05, duration: 1.5, ease: "power1.inOut" }, 3.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
